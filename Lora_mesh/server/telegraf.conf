[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"


[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]


  topics = [
    "iot/mesh/node/+/metrics/#",
    "iot/power/gateway"
  ]


  name_override = "mqtt_consumer"


  data_format = "json"


  tag_keys = ["mac"]


[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "sensores"